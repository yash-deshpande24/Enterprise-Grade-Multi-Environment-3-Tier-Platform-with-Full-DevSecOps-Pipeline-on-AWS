<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3-Tier AWS Platform Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
    h1 { color: #232f3e; }
    #status, #items { background: #f4f4f4; padding: 15px; border-radius: 8px; margin-top: 15px; }
    button { background: #ff9900; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>3-Tier AWS Platform</h1>
  <p>Web tier is serving this page. Click below to call the App tier via the internal ALB.</p>
  <button onclick="checkStatus()">Check App Tier Status</button>
  <div id="status">Status will appear here...</div>
  <div id="items"></div>

  <script>
    async function checkStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('status').innerText = JSON.stringify(data, null, 2);

        const itemsRes = await fetch('/api/items');
        const itemsData = await itemsRes.json();
        document.getElementById('items').innerText = JSON.stringify(itemsData, null, 2);
      } catch (err) {
        document.getElementById('status').innerText = 'Error reaching app tier: ' + err;
      }
    }
  </script>
</body>
</html>
